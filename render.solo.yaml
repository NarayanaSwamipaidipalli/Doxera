# Choose this path explicitly. The account-based application has separate Blueprints.
previews:
  generation: 'off'
services:
  - type: web
    name: doxera-solo
    runtime: docker
    branch: main
    region: singapore
    plan: 1c-2g
    numInstances: 1
    autoDeploy: true
    dockerContext: ./services/pdf-worker
    dockerfilePath: ./services/pdf-worker/Dockerfile.solo
    healthCheckPath: /health
    envVars:
      - key: SOLO_SESSION_SECRET
        generateValue: true
      - key: SOLO_PRIVACY_EMAIL
        sync: false
      - key: SOLO_ACCESS_MODE
        value: public
      - key: SOLO_TRIAL_PASSWORD
        sync: false
