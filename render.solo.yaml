# Choose this path explicitly. The account-based application has separate Blueprints.
previews:
  generation: 'off'
services:
  - type: web
    name: doxera-solo
    runtime: docker
    branch: solo-tools
    region: singapore
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: 'off'
    dockerContext: ./services/pdf-worker
    dockerfilePath: ./services/pdf-worker/Dockerfile.solo
    healthCheckPath: /health
    envVars:
      - key: SOLO_SESSION_SECRET
        generateValue: true
      - key: SOLO_PRIVACY_EMAIL
        sync: false
      - key: SOLO_ACCESS_MODE
        value: trial
      - key: SOLO_TRIAL_PASSWORD
        sync: false
      - key: SOLO_SOURCE_URL
        value: https://github.com/NarayanaSwamipaidipalli/Doxera/archive/refs/tags/solo-v1.0.0-rc.2.tar.gz
